rules:
  - id: xqueue-no-rich-outside-output
    languages:
      - python
    message: Rich imports should stay in the shared CLI output module.
    severity: ERROR
    paths:
      include:
        - apps/**/*.py
        - libs/**/*.py
      exclude:
        - apps/cli/output.py
    pattern-regex: '^(from rich|import rich)'

  - id: xqueue-no-typer-outside-cli
    languages:
      - python
    message: Typer imports should stay in apps/cli shells.
    severity: ERROR
    paths:
      include:
        - libs/**/*.py
    pattern-regex: '^(from typer|import typer)'

  - id: xqueue-no-sqlalchemy-in-apps-or-domain
    languages:
      - python
    message: SQLAlchemy imports should stay out of apps and domain layers.
    severity: ERROR
    paths:
      include:
        - apps/**/*.py
        - libs/domain/**/*.py
    pattern-regex: '^(from sqlalchemy|import sqlalchemy)'

  - id: xqueue-no-subprocess-outside-approved-services
    languages:
      - python
    message: Subprocess use should stay in approved service modules.
    severity: ERROR
    paths:
      include:
        - apps/**/*.py
        - libs/**/*.py
      exclude:
        - libs/services/launchd.py
        - libs/services/systemd.py
        - libs/services/execution.py
        - libs/services/controller.py
    pattern-regex: '^(from subprocess|import subprocess)'
