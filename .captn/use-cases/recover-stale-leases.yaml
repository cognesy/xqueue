schema_version: 1
id: recover-stale-leases
title: Recover jobs whose worker died mid-execution
capability: maintenance
status: implemented
narrative:
  as_a: operator
  i_want: jobs abandoned by a dead worker to become runnable again
  so_that: a crash does not silently strand work in the running state
expected_behavior:
- scenario: A worker dies while holding a job
  given:
  - a job claimed by a worker whose heartbeat has stopped
  - a lease that has expired
  when: the operator runs stale-lease recovery
  then:
  - the job is requeued or failed according to its retry policy
  - the recovery outcome is recorded in the job's history
acceptance_criteria:
- Recovery is the mechanism that makes at-least-once delivery true rather than aspirational.
- A job with attempts remaining is requeued; one without is failed.
- Recovery never disturbs a job whose lease is still being renewed.
priority: critical
source_refs:
