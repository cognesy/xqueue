schema_version: 1
id: read-queue-depth
title: Read queue depth and job-state counts
capability: queues
status: implemented
narrative:
  as_a: agent
  i_want: aggregate counts per queue and job state
  so_that: I can decide whether work is backing up before enqueueing more
expected_behavior:
- scenario: Statistics are requested
  given:
  - jobs distributed across queues and states
  when: the caller asks for queue statistics
  then:
  - each queue is returned with counts broken down by job state
  - the response uses the stable list envelope
acceptance_criteria:
- Statistics are derived through the public job-state contract, not SQLite models.
- Counts are consistent with what a job list of the same filter would return.
