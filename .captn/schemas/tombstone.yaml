type: object
additionalProperties: false
required: [schema_version, kind, record_id, removed_at, reason, record]
properties:
  schema_version: {type: integer, enum: [1]}
  kind: {type: string, enum: [intent, capability, usecase]}
  record_id: {type: string, pattern: "^[a-z0-9][a-z0-9-]*$"}
  removed_at: {type: string, minLength: 1}
  reason: {type: string, minLength: 1}
  record: {type: object}
