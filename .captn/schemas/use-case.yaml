type: object
additionalProperties: false
required: [schema_version, id, title, capability, status, narrative, expected_behavior, acceptance_criteria]
properties:
  schema_version: {type: integer, enum: [1]}
  id: {type: string, pattern: "^[a-z0-9][a-z0-9-]*$"}
  title: {type: string, minLength: 1}
  capability: {type: string, pattern: "^[a-z0-9][a-z0-9-]*$"}
  status: {type: string, enum: [implemented, in_progress, planned, deprecated, retired]}
  priority: {type: string, enum: [critical, high, medium, low, backlog]}
  narrative:
    type: object
    additionalProperties: false
    required: [as_a, i_want, so_that]
    properties:
      as_a: {type: string, pattern: "^[a-z0-9][a-z0-9-]*$"}
      i_want: {type: string, minLength: 1}
      so_that: {type: string, minLength: 1}
  expected_behavior:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [scenario, given, when, then]
      properties:
        scenario: {type: string, minLength: 1}
        given: {type: array, minItems: 1, items: {type: string, minLength: 1}}
        when: {type: string, minLength: 1}
        then: {type: array, minItems: 1, items: {type: string, minLength: 1}}
  acceptance_criteria: {type: array, minItems: 1, items: {type: string, minLength: 1}}
  source_refs:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [type, path]
      properties:
        type: {type: string, enum: [code, docs, spec, tests, issue, runtime]}
        path: {type: string, minLength: 1}
        section: {type: string}
        command: {type: string}
        symbol: {type: string}
        line: {type: integer, minimum: 1}
  interfaces:
    type: object
    additionalProperties: false
    properties:
      cli: {type: array, items: {type: string, minLength: 1}}
      api: {type: array, items: {type: string, minLength: 1}}
      http: {type: array, items: {type: string, minLength: 1}}
      ui: {type: array, items: {type: string, minLength: 1}}
      files: {type: array, items: {type: string, minLength: 1}}
      events: {type: array, items: {type: string, minLength: 1}}
  actions:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind: {type: string, enum: [cli_command, action_function, action_class, api_endpoint, ui_action, event_handler, background_job, file_operation, external_integration]}
        name: {type: string, minLength: 1}
        module: {type: string}
        symbol: {type: string}
        class: {type: string}
        method: {type: string}
        fq_name: {type: string}
        command: {type: string}
        route: {type: string}
        path: {type: string}
        confidence: {type: string, enum: [confirmed, inferred, speculative]}
        refs: {type: array, items: {type: string, minLength: 1}}
        notes: {type: array, items: {type: string, minLength: 1}}
  edge_cases: {type: array, items: {type: string, minLength: 1}}
  related_tests: {type: array, items: {type: string, minLength: 1}}
  open_questions: {type: array, items: {type: string, minLength: 1}}
  notes: {type: array, items: {type: string, minLength: 1}}
  provenance:
    type: object
    additionalProperties: false
    required: [mode, confidence]
    properties:
      mode: {type: string, enum: [authored, reconstructed, mixed]}
      confidence: {type: string, enum: [confirmed, inferred, speculative]}
  changelog:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [at, change, reason]
      properties:
        at: {type: string, minLength: 1}
        change: {type: string, minLength: 1}
        reason: {type: string, minLength: 1}
        by: {type: string}
  custom: {type: object}
