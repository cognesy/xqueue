schema_version: 1
id: interfaces
title: Operator and agent interfaces
status: implemented
summary: The two channels the capabilities are reached through -- the xq CLI and the
  Python SDK -- and the output, envelope, and exit-code contract that makes the CLI
  usable as an API.
user_value: Automation can drive xqueue through a stable machine-readable contract
  instead of scraping prose, and a Python program can own a queue directly without
  shelling out or installing the CLI stack.
scope_boundary:
  includes:
  - Output modes toon, json, jsonl, text, and tmux, with toon as the default.
  - Stable envelopes for lists, details, mutations, and failures.
  - stdout as the payload and stderr as structured structlog output.
  - Exit codes distinguishing usage, configuration, and runtime failure.
  - Field selection and the compact agent-facing rendering.
  - A version flag answered before the CLI stack is imported, so an install can be
    identified even when it is incomplete.
  - The Xqueue SDK facade and its cached capability facets.
  - Keeping both channels resolving configuration through one loader.
  excludes:
  - Any network, HTTP, or web interface; a UI is a recorded non-goal.
  - Business decisions; channels project results, they do not compute them.
  - Rich formatting anywhere but the text output mode.
  assumptions:
  - The CLI is the main interface, not a thin wrapper over a library.
  - The SDK returns domain values, never CLI envelopes.
  - Importing xqueue does not import Typer or Rich; the CLI is an extra.
  - The CLI must not import click, because Typer vendors it.
