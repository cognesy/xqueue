schema_version: 1
id: workers
title: Workers
status: implemented
summary: The processes that claim jobs transactionally and execute them as subprocesses
  in their own process groups, with leases, heartbeats, timeouts, and cooperative
  cancellation.
user_value: Work actually runs, one claim per job, with concurrency the operator chose
  -- and a job whose worker dies does not stay claimed forever.
scope_boundary:
  includes:
  - Transactional claiming so two workers cannot take the same job.
  - Worker registration and the active, paused, draining, and stopped states.
  - Lease renewal by heartbeat while a job runs.
  - Subprocess execution in a process group, capturing stdout and stderr.
  - Timeout enforcement and SIGTERM-then-SIGKILL cancellation of the group.
  - Retry and outcome recording for each attempt.
  - Polling loops, one-shot claims, and bounded in-process concurrency.
  excludes:
  - Supervising worker processes as a fleet, which the controller owns.
  - Recovering leases that already went stale, which maintenance owns.
  - Deciding what command to run; workers execute what was enqueued.
  assumptions:
  - Process-group control is required for timeout and cancellation to be correct.
  - Concurrency above one is only supported in continuous execute-claimed mode.
