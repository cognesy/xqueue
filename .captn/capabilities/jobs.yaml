schema_version: 1
id: jobs
title: Jobs
status: implemented
summary: 'The queued unit of work and everything an operator does to one: enqueue,
  list, show, cancel, retry, delete, purge, and read its attempt output.'
user_value: A shell command handed to xqueue is durable, addressable by id, and inspectable
  afterwards -- including the stdout, stderr, and lifecycle events of every attempt
  it took.
scope_boundary:
  includes:
  - Enqueueing a command with queue, cwd, env, timeout, and attempt policy.
  - Job state as an explicit lifecycle rather than an implicit flag.
  - Attempt history, exit codes, and per-attempt log and event file paths.
  - Filtered and sorted listing, single-job detail, and tailing attempt output.
  - Cancel, retry, delete, and purge as operator-visible transitions.
  excludes:
  - Deciding when a job should be created; that is upstream of xqueue.
  - Dependencies between jobs; DAG semantics are a recorded non-goal.
  - Executing the command, which workers own.
  assumptions:
  - A job is one command string plus execution metadata, not a callable.
  - Delivery is at-least-once, so a job may run more than once.
