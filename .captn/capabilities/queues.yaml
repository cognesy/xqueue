schema_version: 1
id: queues
title: Queues
status: implemented
summary: Named lanes that jobs are enqueued into and claimed from, with per-queue
  admission control and aggregate counts.
user_value: Work can be separated by kind and throttled independently, so pausing
  one class of work does not stop everything else on the machine.
scope_boundary:
  includes:
  - Queue existence, listing, and paused or active state.
  - Pausing and resuming a single named queue's claims.
  - Aggregate statistics such as counts by job state.
  - Queue-level purge policy.
  excludes:
  - Priority ordering across queues; xqueue does not schedule.
  - Routing rules that decide which queue a job belongs in.
  - Per-queue worker supervision, which the controller owns.
  assumptions:
  - Queues are created implicitly by use rather than declared up front.
  - Queue statistics read job state through a public contract, never the SQLite models.
