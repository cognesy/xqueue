[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xqueue"
version = "0.1.0"
description = "CLI-first, single-machine durable work queue for shell commands"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16.5",
  "pydantic>=2.11.9",
  "pyyaml>=6.0.3",
  "sqlalchemy>=2.0.43",
  "structlog>=25.4.0",
  "xcfg>=0.5.0",
]

# The CLI's frameworks are an extra so that embedding `Xqueue` does not drag in
# a terminal renderer. `xq` stays declared by the base distribution and exits 2
# with a hint when the extra is absent; see `xqueue_cli.entry`.
[project.optional-dependencies]
cli = [
  "python-toon>=0.1.3",
  "rich>=14.1.0",
  "typer>=0.16.1",
]
all = ["xqueue[cli]"]

[project.scripts]
xq = "xqueue_cli.entry:main"

[tool.setuptools]
include-package-data = true
packages = [
  "xqueue_cli",
  "xqueue_cli.commands",
  "xqueue_cli.renderers",
  "xqueue",
  "xqueue.adapters",
  "xqueue.adapters.filesystem",
  "xqueue.adapters.sqlite",
  "xqueue.core",
  "xqueue.controller",
  "xqueue.jobs",
  "xqueue.maintenance",
  "xqueue.queues",
  "xqueue.runtime",
  "xqueue.workspace",
  "xqueue.workers",
  "xqueue_resources",
  "xqueue_resources.alembic",
  "xqueue_resources.alembic.versions",
  "xqueue_resources.config",
  "xqueue_resources.logging",
  "xqueue_resources.schemas",
  "xqueue_resources.skills",
]

[tool.setuptools.package-dir]
xqueue_cli = "apps/cli"
xqueue = "libs"
xqueue_resources = "resources"

[tool.setuptools.package-data]
xqueue = ["py.typed"]
xqueue_resources = [
  "alembic/.gitkeep",
  "alembic/env.py",
  "alembic/script.py.mako",
  "alembic/versions/*.py",
  "config/.gitkeep",
  "logging/*.yaml",
  "schemas/.gitkeep",
  "skills/*/SKILL.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# The wheel remaps package directories (libs -> xqueue, apps/cli -> xqueue_cli),
# and the editable install uses an import finder mypy cannot follow, so the
# .typecheck symlink tree gives the checker the shipped package names.
mypy_path = ".typecheck"
packages = ["xqueue", "xqueue_cli"]
python_version = "3.11"
# py.typed promises consumers that every shipped signature is real.
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["toon.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
  # Development installs the CLI extra: the suite exercises both channels.
  "xqueue[cli]",
  "import-linter>=2.13",
  "mypy>=1.15",
  "pytest>=8.4.2",
  "types-pyyaml>=6",
]

[tool.uv]
package = true

# xcfg 0.5.0 is tagged but not yet published, so the pin above cannot resolve
# from an index. This source override is what makes it installable today, and
# it must be deleted the moment xcfg 0.5.0 reaches a package index -- the
# dependency declaration is already correct and needs no change.
[tool.uv.sources]
xcfg = { path = "../../_libs/xcfg", editable = true }
