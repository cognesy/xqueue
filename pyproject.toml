[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xqueue"
version = "0.1.0"
description = "CLI-first, single-machine durable work queue for shell commands"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16.5",

  "pydantic>=2.11.9",
  "python-toon>=0.1.3",
  "pyyaml>=6.0.3",
  "rich>=14.1.0",
  "sqlalchemy>=2.0.43",
  "structlog>=25.4.0",
  "typer>=0.16.1",
]

[project.scripts]
xq = "xqueue_cli.main:main"

[tool.setuptools]
include-package-data = true
packages = [
  "xqueue_cli",
  "xqueue_cli.commands",
  "xqueue_libs",
  "xqueue_libs.actions",
  "xqueue_libs.domain",
  "xqueue_libs.infra",
  "xqueue_libs.services",
  "xqueue_resources",
  "xqueue_resources.alembic",
  "xqueue_resources.alembic.versions",
  "xqueue_resources.config",
  "xqueue_resources.logging",
  "xqueue_resources.schemas",
  "xqueue_resources.skills",
]

[tool.setuptools.package-dir]
xqueue_cli = "apps/cli"
xqueue_libs = "libs"
xqueue_resources = "resources"

[tool.setuptools.package-data]
xqueue_resources = [
  "alembic/.gitkeep",
  "alembic/env.py",
  "alembic/script.py.mako",
  "alembic/versions/*.py",
  "config/.gitkeep",
  "logging/*.yaml",
  "schemas/.gitkeep",
  "skills/*/SKILL.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
  "pytest>=8.4.2",
]

[tool.uv]
package = true
