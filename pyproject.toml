[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "xqueue"
version = "0.1.0"
description = "CLI-first, single-machine durable work queue for shell commands"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16.5",
  "platformdirs>=4.4.0",
  "pydantic>=2.11.9",
  "pyyaml>=6.0.3",
  "rich>=14.1.0",
  "sqlalchemy>=2.0.43",
  "structlog>=25.4.0",
  "typer>=0.16.1",
]

[project.scripts]
xq = "apps.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["apps", "libs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
  "pytest>=8.4.2",
]

[tool.uv]
package = true
